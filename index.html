<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Auto Battler</title>
<style>
  :root { --bg:#0e1116; --panel:#171c24; --line:#2a323f; --text:#e6edf3; --dim:#8b97a7; --acc:#ffb000; --good:#3fb950; --warn:#f0c000; --orange:#ff7b2e; --bad:#f85149;
    --engine:#ff6b5b; --design:#5aa9ff; --tires:#e6c229; --handling:#2fd1c0; --pilot:#b58cff; --marketing:#ff8fc7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #app { max-width:480px; margin:0 auto; padding:14px 14px 40px; }
  h1 { font-size:22px; margin:6px 0 4px; color:var(--acc); }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:20px 0 8px; }
  h2.mine { color:#7fb2ff; } h2.shop { color:#ffc56b; }
  p { margin:6px 0; }
  .dim { color:var(--dim); }
  .top { display:flex; justify-content:space-between; align-items:baseline; font-size:16px; }
  .bar { display:flex; justify-content:space-between; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  .bar b { color:var(--acc); }
  .msg { background:#1f2a1c; border:1px solid #2f5a2b; border-radius:8px; padding:8px 10px; margin:8px 0; color:#b6e3b0; }
  .msg.err { background:#2a1c1c; border-color:#5a2b2b; color:#f0b6b6; }
  button { font:inherit; color:var(--text); background:#242c38; border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-height:44px; cursor:pointer; }
  button:active { background:#2f3947; }
  button:disabled { opacity:.4; cursor:default; }
  button.big { width:100%; background:var(--acc); color:#1a1200; border-color:var(--acc); font-weight:700; font-size:16px; margin:12px 0; }
  button.go { background:var(--good); color:#04200a; border-color:var(--good); font-weight:700; }
  button.sell { min-height:30px; padding:2px 10px; font-size:12px; background:#2a1f26; border-color:#5a3346; color:#ffb3cf; }
  .row { display:flex; gap:8px; margin:10px 0; }
  .row button { flex:1; }

  /* part type colors */
  .k-engine { --k:var(--engine); } .k-design { --k:var(--design); } .k-tires { --k:var(--tires); }
  .k-handling { --k:var(--handling); } .k-pilot { --k:var(--pilot); } .k-marketing { --k:var(--marketing); }
  .blk { border-left:5px solid var(--k); border-radius:8px; padding:8px 10px; margin:6px 0; }
  .blk.mine { background:#132238; border-top:1px solid #1f3a5c; border-right:1px solid #1f3a5c; border-bottom:1px solid #1f3a5c; }
  .blk.shop { background:#2b2214; border-top:1px solid #5a4520; border-right:1px solid #5a4520; border-bottom:1px solid #5a4520; padding:10px; margin:10px 0; }
  .bh { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .tc { display:inline-block; font-size:12px; font-weight:700; padding:1px 7px; border-radius:6px; border:1px solid currentColor; margin-left:6px; vertical-align:1px; }
  .tc.t0 { color:#8b97a7; } .tc.t1 { color:#c9d1d9; } .tc.t2 { color:#3fb950; background:#12301a; } .tc.t3 { color:#58a6ff; background:#0f2440; } .tc.t4 { color:#f5b301; background:#3a2c05; }
  .at { font-size:13px; font-weight:700; color:var(--text); margin-left:6px; }
  .sticky { position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0 2px; margin:-6px 0 0; border-bottom:1px solid var(--line); }
  .sticky .bar { margin:6px 0 4px; }
  .fline { font-size:13px; margin:0 2px 4px; }
  button.lock { background:#1f2a3a; border-color:#3a5a85; }
  button.lock.on { background:#3a2c05; border-color:var(--acc); color:var(--acc); font-weight:700; }
  .sn { color:var(--k); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .pn { font-weight:700; }
  .d { color:var(--dim); font-size:13px; }
  .star { color:var(--acc); }
  .tag { font-size:12px; margin:6px 0; }
  .tag.up { color:var(--good); font-weight:700; }
  .tag.rep { color:var(--dim); }
  .blk.shop button.buy { width:100%; }
  .pl { border-left:3px solid var(--k); padding:2px 8px; margin:4px 0; }
  .pn { font-size:17px; }
  .sub { color:var(--dim); font-size:11.5px; margin-top:1px; }
  .xp { color:#9fd0ff; font-size:12px; margin-top:3px; }
  .fc { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:13.5px; }
  .fc b { color:var(--acc); }
  .wbar { position:relative; height:16px; background:#222b37; border-radius:8px; overflow:hidden; margin:3px 0 4px; }
  .wfill { height:100%; }
  .wbar i { position:absolute; top:0; bottom:0; width:2px; background:#0e1116; }
  .wrow { display:flex; justify-content:space-between; font-size:13px; }
  .wlog { font-size:12.5px; min-height:18px; }
  .r-spin { color:var(--bad); font-weight:700; }
  .r-puncture { color:var(--warn); } .r-pit { color:var(--orange); } .r-crash { color:var(--bad); font-weight:700; }
  #wear { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }

  pre { margin:8px 0; font:inherit; white-space:pre; overflow-x:auto; }
  #track { line-height:1.12; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center; display:block; overflow:hidden; }
  #live { font-size:12.5px; line-height:1.45; }
  .c { font-weight:700; }
  .c.me { color:#04200a !important; background:var(--good); }
  .c.s1 { background:var(--warn); color:#000 !important; }
  .c.s2 { background:var(--orange); color:#000 !important; }
  .c.s3 { background:var(--bad); color:#000 !important; }
  .c.s4 { background:#b58cff; color:#000 !important; }
  .r-turn { color:#b58cff; }
  .tk { color:#5b6778; }
  .fl { color:var(--acc); font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td, th { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; }
  td.n, th.n { text-align:right; }
  tr.you td { color:var(--acc); font-weight:700; }
  tr.out td { color:var(--dim); text-decoration:line-through; }
  details { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  details.team.you { border-color:var(--acc); }
  summary { cursor:pointer; }
  details > summary { color:var(--dim); }
  details.team > summary { color:var(--text); display:flex; gap:8px; }
  details.team .pos { width:20px; text-align:right; color:var(--dim); }
  details.team .nm { flex:1; }
  details.team .pts { color:var(--acc); }
  .big-result { font-size:18px; margin:10px 0; }
  #ann { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin:8px 0; font-size:13px; min-height:62px; }
  #ann .al { margin:2px 0; } #ann .al.me { color:var(--good); font-weight:700; } #ann .t { color:var(--dim); font-size:11.5px; margin-right:6px; }
  #ann.done { max-height:220px; overflow-y:auto; }
  .lt-on { color:#f85149; } .lt-off { color:#3a2222; } .go { color:#3fb950; font-weight:700; }
  select { font:inherit; color:var(--text); background:#242c38; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:18px; }
  .new { background:var(--good); color:#04200a; font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:6px; }
  details.wn ul { margin:6px 0; padding-left:18px; } details.wn li { margin:3px 0; font-size:13.5px; }
  details.wn > summary { color:var(--acc); font-weight:700; }
  .spark { display:block; margin:3px 0 0; } .spark-l { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<div id="app"><p class="dim">Warming up the paddock...</p></div>
<script src="engine.js?v=0.9"></script>
<script src="bots.js?v=0.9"></script>
<script>
(function () {
  'use strict';
  var AB = window.AB, Bots = window.Bots, CFG = AB.CFG;
  var $ = document.getElementById('app');
  var lib = null, run = null, report = null, timer = null, track = null;
  var LIB_SIZE = 80, LIB_SEED = 777, FRAME_MS = 90; // frames per step come from schedule()
  var ZONE = ['#3fb950', '#a3d535', '#f0c000', '#ff7b2e', '#f85149', '#f85149']; // wear zone colors: marks passed 0..4, over 100%

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function pad(s, n) { s = String(s); while (s.length < n) s += ' '; return s.slice(0, n); }
  function padL(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }

  // ---------- storage (may be unavailable) ----------
  var KEY = 'ab_stats_v1', SAVE_KEY = 'ab_save_v1';
  function defaultStats() { return { runs: 0, wins: 0, bestScore: 0, bestRound: 0, raceN: 0, placeSum: 0, champN: 0, champSum: 0 }; }
  function loadStats() { try { return Object.assign(defaultStats(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return defaultStats(); } }
  function saveStats(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function persist() { try { if (run && run.phase === 'shop') localStorage.setItem(SAVE_KEY, AB.serialize(run)); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function readSave() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }

  // ---------- helpers ----------
  function label(car) { return car.player ? '@' : String(car.id); }
  var FLAG_KEY = 'ab_flag';
  function myFlag() { try { return localStorage.getItem(FLAG_KEY) || '🏁'; } catch (e) { return '🏁'; } }
  var flagCache = { run: null, map: null, mine: null };
  function flagOf(car) {
    if (flagCache.run !== run || flagCache.mine !== myFlag()) flagCache = { run: run, mine: myFlag(), map: AB.fieldFlags(run.field, myFlag()) };
    return flagCache.map[car.id] || '';
  }
  function tname(car) { return flagOf(car) + ' ' + car.name; }
  function teamColor(car) { return AB.colorOf(car.id).c; } // fixed per team, the player is green
  function chips(p) { // tier badge (rarity colors) + archetype name
    if (p.t === 0) return '<span class="tc t0">Stock</span>';
    return '<span class="tc t' + p.t + '">T' + p.t + '</span><span class="at">' + esc(AB.archInfo(p.s, p.a).name) + '</span>';
  }
  function partLine(p) { // compact colored line used in team details
    var xp = AB.expText(p);
    return '<div class="pl k-' + p.s + '"><span class="sn">' + AB.SLOT_NAME[p.s] + '</span>' + chips(p) + '<div><b>' + esc(AB.partName(p)) + '<span class="star">' + AB.stars(p) + '</span></b></div>' +
      '<div class="d">' + esc(AB.describe(p)) + '</div>' + (xp ? '<div class="xp">' + esc(xp) + '</div>' : '') + '</div>';
  }
  function slotBlock(p, canSell) {
    var sell = (canSell && p.t > 0) ? '<button class="sell" data-act="sell" data-s="' + p.s + '">Sell +' + AB.sellValue(p) + '</button>' : '';
    return '<div class="blk mine k-' + p.s + '"><div class="bh"><span><span class="sn">' + AB.SLOT_NAME[p.s] + '</span>' + chips(p) + '</span>' + sell + '</div>' +
      '<span class="pn">' + esc(AB.partName(p)) + '<span class="star">' + AB.stars(p) + '</span></span><div class="d">' + esc(AB.describe(p)) + '</div>' + spark(p) +
      (AB.expText(p) ? '<div class="xp">' + esc(AB.expText(p)) + '</div>' : '') + '</div>';
  }
  // Power curve sparkline for engines and designs: the shape of the part over steps 1-12 (each curve scaled to its own peak).
  function spark(p) {
    if (p.t === 0 || (p.s !== 'engine' && p.s !== 'design')) return '';
    var f = p.s === 'engine' ? AB.engineFn(p) : AB.designFn(p), v = [], mx = 0, i;
    for (i = 1; i <= 12; i++) { v.push(f(i)); mx = Math.max(mx, v[i - 1]); }
    var pts = v.map(function (y, k) { return (k * 120 / 11).toFixed(1) + ',' + (20 - 18 * y / (mx || 1)).toFixed(1); }).join(' ');
    return '<svg class="spark" width="120" height="22" viewBox="0 -1 120 23"><polyline fill="none" stroke="var(--k)" stroke-width="2" points="' + pts + '"/></svg><span class="spark-l">' + (p.s === 'engine' ? 'power' : 'bonus') + ' over the race</span>';
  }
  var RISK_COL = { LOW: '#3fb950', MEDIUM: '#f0c000', HIGH: '#ff7b2e', EXTREME: '#f85149' };
  var GRIP_COL = { STEADY: '#3fb950', OK: '#a3d535', SHAKY: '#ff7b2e', WILD: '#f85149' };
  function forecastHTML() {
    var f = AB.forecast(run.build, run.round, { behind: AB.playerBehind(run) }), mine = f.mid.fin ? f.mid.x : 99, faster = 0, n = 0;
    run.field.forEach(function (c) {
      if (c.player || !c.alive) return;
      var o = AB.forecast(c.career.builds[run.round - 1], run.round);
      n++; if (mine < (o.mid.fin ? o.mid.x : 99)) faster++;
    });
    var pace = !n ? '' : faster >= n * 2 / 3 ? 'front of the field' : faster >= n / 3 ? 'midfield' : 'back of the field';
    var trouble = { LOW: 'should hold up fine', MEDIUM: 'might give you a problem', HIGH: 'will probably give you trouble', EXTREME: 'could easily end your race' }[f.risk];
    return { line: '<div class="fline">Pace <b>' + pace + '</b> · Tires <b style="color:' + RISK_COL[f.risk] + '">' + f.risk + '</b> · Grip <b style="color:' + GRIP_COL[f.grip] + '">' + f.grip + '</b></div>',
      detail: '<div class="fc">Your tires ' + trouble + '.' + (f.overheat ? ' <span style="color:#f85149">At full push they won’t last the whole race.</span>' : '') + ' ' + { STEADY: 'Your handling keeps the car steady.', OK: 'The car wobbles now and then near top speed.', SHAKY: 'The car gets shaky near top speed: better Handling would help.', WILD: 'The car fights you near top speed and may spin out: get Handling!' }[f.grip] + ' <span class="dim">Pace assumes your tires hold.</span></div>' };
  }
  function standingsTable() {
    var st = AB.standings(run), h = '<table><tr><th>#</th><th>Team</th><th class="n">Pts</th></tr>';
    st.forEach(function (c, i) {
      h += '<tr class="' + (c.player ? 'you' : '') + (c.alive ? '' : ' out') + '"><td>' + (i + 1) + '</td><td><span style="color:' + teamColor(c) + '">' + esc(label(c)) + '</span> ' + esc(tname(c)) + '</td><td class="n">' + c.points + '</td></tr>';
    });
    return h + '</table>';
  }

  // ---------- start screen ----------
  var SEEN_KEY = 'ab_seen_version';
  function whatsNew() {
    var seen = null; try { seen = localStorage.getItem(SEEN_KEY); localStorage.setItem(SEEN_KEY, AB.VERSION); } catch (e) {}
    var h = '';
    AB.CHANGELOG.forEach(function (c, i) {
      h += '<details class="wn"' + (i === 0 ? ' open' : '') + '><summary>' + (i === 0 ? 'What’s new in v' : 'v') + esc(c.v) + (i === 0 && seen !== AB.VERSION ? '<span class="new">New!</span>' : '') + '</summary><ul>' +
        c.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></details>';
    });
    return h;
  }
  function showStart() {
    var s = loadStats(), saved = readSave();
    var avgRace = s.raceN ? (s.placeSum / s.raceN).toFixed(2) : '-', avgChamp = s.champN ? (s.champSum / s.champN).toFixed(2) : '-';
    var h = '<h1>Racing Auto Battler <span class="dim" style="font-size:12px">v' + AB.VERSION + '</span></h1>' +
      '<p class="dim">Build a racing team out of six math functions, then race 9 rounds against 9 recorded rival cars. The last-placed team is cut after rounds 2, 4, 6 and 8.</p>';
    if (saved) h += '<button class="big" data-act="resume" style="background:var(--good);border-color:var(--good);color:#04200a">Resume championship</button>';
    h += '<button class="' + (saved ? '' : 'big') + '" data-act="new" style="width:100%">New Championship</button>' +
      '<p>Your flag <select id="flagSel">' + AB.FLAGS.map(function (f) { return '<option' + (f === myFlag() ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select></p>' +
      whatsNew() +
      '<details><summary>How it works</summary>' +
      '<p>Each round: shop, then a 3-lap race. Every car adds its output each step; first across the line after 3 laps wins. Times are shown in seconds (one step is about 9 seconds).</p>' +
      '<p><b style="color:var(--engine)">Engine</b> makes power, <b style="color:var(--design)">Design</b> multiplies it, <b style="color:var(--tires)">Tires</b> have a limit: push the engine past it and you risk a puncture, a blowout or a crash. <b style="color:var(--handling)">Handling</b> and <b style="color:var(--pilot)">Pilot</b> shape the dice. <b style="color:var(--marketing)">Marketing</b> earns credits and rerolls.</p>' +
      '<p>Every car has a top speed, and builds decide how fast it gets there. Tires wear as you push the engine, and the more worn they are, the likelier trouble gets: a puncture costs half your speed, a spin turns you around for a moment and costs ground, a blowout sends you to the pits for fresh tires (you restart slowly), and a crash ends your race. Crashes mostly happen when tires overheat. Tires cool a little at each lap line.</p>' +
      '<p>Near top speed the car needs grip. Without enough, it gets shaky (slower, harder on tires) or even spins out. Handling parts and a Ground effect design add grip. The shop forecast tells you your pace, tire risk and grip.</p>' +
      '<p>Buying the exact same part you own (same archetype and tier) upgrades it, up to 3 stars, for 75% of its price, and keeps its experience. Upgraded parts season every race and grow; pilots always gain experience. Buying a different part for a slot trades the old one in for half of what you paid. You can also sell a part for half of what you paid.</p>' +
      '<p><b style="color:var(--marketing)">Marketing</b>: Sponsors pay the most credits and a signing bonus, Scouts add shop offers and rerolls and find copies of parts you own (upgrades), Brand brings fans (a better worst pilot roll), a crowd that cheers harder the further behind you are, and prize money for every point you score.</p>' +
      '<p>Lock the shop to keep its offers for next round (free, unlock any time).</p>' +
      '<p>Points (F1 style): 25, 18, 15, 12, 10, 8, 6, 4, 2, 1. A crash scores 0. Your game saves itself after every shop action.</p></details>' +
      '<h2>Your stats</h2><table>' +
      '<tr><td>Championships finished</td><td class="n">' + s.runs + '</td></tr>' +
      '<tr><td>Championship wins</td><td class="n">' + s.wins + '</td></tr>' +
      '<tr><td>Highest score</td><td class="n">' + s.bestScore + '</td></tr>' +
      '<tr><td>Highest round reached</td><td class="n">' + s.bestRound + '</td></tr>' +
      '<tr><td>Avg race placement</td><td class="n">' + avgRace + '</td></tr>' +
      '<tr><td>Avg championship placement</td><td class="n">' + avgChamp + '</td></tr></table>';
    $.innerHTML = h;
  }

  // ---------- shop ----------
  function showShop(msg, isErr) {
    var T = AB.raceLen(run.round), alive = run.field.filter(function (c) { return c.alive; }).length;
    var fc = forecastHTML();
    var h = '<div class="sticky"><div class="top"><b>Round ' + run.round + '/' + CFG.rounds + ' · Shop</b><span class="dim">' + CFG.laps + ' laps</span></div>' +
      '<div class="bar"><span>Credits <b>' + run.credits + '</b></span><span>Rerolls <b>' + run.rerollsLeft + '</b></span><span>Cars <b>' + alive + '</b></span></div>' + fc.line + '</div>' + fc.detail;
    if (msg) h += '<div class="msg' + (isErr ? ' err' : '') + '">' + esc(msg) + '</div>';
    h += '<h2 class="mine">Your car</h2>';
    AB.SLOTS.forEach(function (s) { h += slotBlock(run.build[s], true); });
    h += '<h2 class="shop">Shop offers</h2>';
    if (!run.offers.length) h += '<p class="dim">Sold out. Reroll for new offers or head to the race.</p>';
    run.offers.forEach(function (off, i) {
      var k = AB.classify(run.build, off), own = run.build[off.s], shown, tag;
      if (k.kind === 'upgrade') { shown = AB.applyPurchase(run.build, off)[off.s]; tag = '<div class="tag up">UPGRADE → ' + '★'.repeat(shown.u) + ' (keeps its experience)</div>'; }
      else { shown = AB.newPart(off.s, off.a, off.t); tag = '<div class="tag rep">' + (k.kind === 'maxed' ? 'MAXED OUT' : 'replaces ' + esc(AB.partName(own)) + AB.stars(own) + (k.trade ? ' · trade-in +' + k.trade + ' cr' : '') + (k.bonus ? ' · signing bonus +' + k.bonus + ' cr' : '')) + '</div>'; }
      var dis = (k.kind === 'maxed' || k.cost > run.credits) ? ' disabled' : '';
      h += '<div class="blk shop k-' + off.s + '"><div class="bh"><span><span class="sn">' + AB.SLOT_NAME[off.s] + '</span>' + chips(shown) + '</span></div>' +
        '<span class="pn">' + esc(AB.partName(shown)) + '<span class="star">' + AB.stars(shown) + '</span></span>' +
        '<div class="d">' + esc(AB.describe(shown)) + '</div>' + spark(shown) + tag +
        '<button class="buy" data-act="buy" data-i="' + i + '"' + dis + '>' + (k.kind === 'maxed' ? 'Maxed' : k.cost < 0 ? 'Swap · get ' + (-k.cost) + ' cr' : 'Buy · ' + k.cost + ' cr') + '</button></div>';
    });
    h += '<div class="row"><button class="lock' + (run.locked ? ' on' : '') + '" data-act="lock">' + (run.locked ? '🔒 Locked' : '🔓 Lock shop') + '</button>' +
      '<button data-act="reroll"' + (run.rerollsLeft > 0 && !run.locked ? '' : ' disabled') + '>' + (run.locked ? 'Unlock to reroll' : 'Reroll (' + run.rerollsLeft + ')') + '</button></div>' +
      (run.locked ? '<p class="dim" style="margin:0 0 6px">These offers come back next round. Tap Locked to unlock any time.</p>' : '') +
      '<button class="big go" data-act="race" style="margin-top:4px">Race! ▶</button>' +

    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    actions[b.getAttribute('data-act')]({ i: b.getAttribute('data-i'), s: b.getAttribute('data-s') });
  });

  setTimeout(function () {
    lib = Bots.buildLibrary(LIB_SIZE, LIB_SEED);
    var saved = readSave();
    run = saved ? AB.restore(saved, lib) : null;
    if (run) showShop('Championship resumed.');
    else { if (saved) clearSave(); showStart(); }
  }, 30);
})();
</script>
</body>
</html>
