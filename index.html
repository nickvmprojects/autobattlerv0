<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Auto Battler</title>
<style>
  :root { --bg:#0e1116; --panel:#171c24; --line:#2a323f; --text:#e6edf3; --dim:#8b97a7; --acc:#ffb000; --good:#3fb950; --warn:#f0c000; --orange:#ff7b2e; --bad:#f85149;
    --engine:#ff6b5b; --design:#5aa9ff; --tires:#e6c229; --handling:#2fd1c0; --pilot:#b58cff; --marketing:#ff8fc7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #app { max-width:480px; margin:0 auto; padding:14px 14px 40px; }
  h1 { font-size:22px; margin:6px 0 4px; color:var(--acc); }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:20px 0 8px; }
  h2.mine { color:#7fb2ff; } h2.shop { color:#ffc56b; }
  p { margin:6px 0; }
  .dim { color:var(--dim); }
  .top { display:flex; justify-content:space-between; align-items:baseline; font-size:16px; }
  .bar { display:flex; justify-content:space-between; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  .bar b { color:var(--acc); }
  .msg { background:#1f2a1c; border:1px solid #2f5a2b; border-radius:8px; padding:8px 10px; margin:8px 0; color:#b6e3b0; }
  .msg.err { background:#2a1c1c; border-color:#5a2b2b; color:#f0b6b6; }
  button { font:inherit; color:var(--text); background:#242c38; border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-height:44px; cursor:pointer; }
  button:active { background:#2f3947; }
  button:disabled { opacity:.4; cursor:default; }
  button.big { width:100%; background:var(--acc); color:#1a1200; border-color:var(--acc); font-weight:700; font-size:16px; margin:12px 0; }
  button.go { background:var(--good); color:#04200a; border-color:var(--good); font-weight:700; }
  button.sell { min-height:30px; padding:2px 10px; font-size:12px; background:#2a1f26; border-color:#5a3346; color:#ffb3cf; }
  .row { display:flex; gap:8px; margin:10px 0; }
  .row button { flex:1; }

  /* part type colors */
  .k-engine { --k:var(--engine); } .k-design { --k:var(--design); } .k-tires { --k:var(--tires); }
  .k-handling { --k:var(--handling); } .k-pilot { --k:var(--pilot); } .k-marketing { --k:var(--marketing); }
  .blk { border-left:5px solid var(--k); border-radius:8px; padding:8px 10px; margin:6px 0; }
  .blk.mine { background:#132238; border-top:1px solid #1f3a5c; border-right:1px solid #1f3a5c; border-bottom:1px solid #1f3a5c; }
  .blk.shop { background:#2b2214; border-top:1px solid #5a4520; border-right:1px solid #5a4520; border-bottom:1px solid #5a4520; padding:10px; margin:10px 0; }
  .bh { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .tc { display:inline-block; font-size:12px; font-weight:700; padding:1px 7px; border-radius:6px; border:1px solid currentColor; margin-left:6px; vertical-align:1px; }
  .tc.t0 { color:#8b97a7; } .tc.t1 { color:#c9d1d9; } .tc.t2 { color:#3fb950; background:#12301a; } .tc.t3 { color:#58a6ff; background:#0f2440; } .tc.t4 { color:#f5b301; background:#3a2c05; }
  .at { font-size:13px; font-weight:700; color:var(--text); margin-left:6px; }
  .sticky { position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0 2px; margin:-6px 0 0; border-bottom:1px solid var(--line); }
  .sticky .bar { margin:6px 0 4px; }
  .fline { font-size:13px; margin:0 2px 4px; }
  button.lock { background:#1f2a3a; border-color:#3a5a85; }
  button.lock.on { background:#3a2c05; border-color:var(--acc); color:var(--acc); font-weight:700; }
  .sn { color:var(--k); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .pn { font-weight:700; }
  .d { color:var(--dim); font-size:13px; }
  .star { color:var(--acc); }
  .tag { font-size:12px; margin:6px 0; }
  .tag.up { color:var(--good); font-weight:700; }
  .tag.rep { color:var(--dim); }
  .blk.shop button.buy { width:100%; }
  .pl { border-left:3px solid var(--k); padding:2px 8px; margin:4px 0; }
  .pn { font-size:17px; }
  .sub { color:var(--dim); font-size:11.5px; margin-top:1px; }
  .xp { color:#9fd0ff; font-size:12px; margin-top:3px; }
  .fc { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:13.5px; }
  .fc b { color:var(--acc); }
  .wbar { position:relative; height:16px; background:#222b37; border-radius:8px; overflow:hidden; margin:3px 0 4px; }
  .wfill { height:100%; }
  .wbar i { position:absolute; top:0; bottom:0; width:2px; background:#0e1116; }
  .wrow { display:flex; justify-content:space-between; font-size:13px; }
  .wlog { font-size:12.5px; min-height:18px; }
  .r-puncture { color:var(--warn); } .r-pit { color:var(--orange); } .r-crash { color:var(--bad); font-weight:700; }
  #wear { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }

  pre { margin:8px 0; font:inherit; white-space:pre; overflow-x:auto; }
  #track { line-height:1.12; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center; display:block; overflow:hidden; }
  #live { font-size:12.5px; line-height:1.45; }
  .c { font-weight:700; }
  .c.me { color:#04200a !important; background:var(--good); }
  .c.s1 { background:var(--warn); color:#000 !important; }
  .c.s2 { background:var(--orange); color:#000 !important; }
  .c.s3 { background:var(--bad); color:#000 !important; }
  .tk { color:#5b6778; }
  .fl { color:var(--acc); font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td, th { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; }
  td.n, th.n { text-align:right; }
  tr.you td { color:var(--acc); font-weight:700; }
  tr.out td { color:var(--dim); text-decoration:line-through; }
  details { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  details.team.you { border-color:var(--acc); }
  summary { cursor:pointer; }
  details > summary { color:var(--dim); }
  details.team > summary { color:var(--text); display:flex; gap:8px; }
  details.team .pos { width:20px; text-align:right; color:var(--dim); }
  details.team .nm { flex:1; }
  details.team .pts { color:var(--acc); }
  .big-result { font-size:18px; margin:10px 0; }
</style>
</head>
<body>
<div id="app"><p class="dim">Warming up the paddock...</p></div>
<script src="engine.js?v=0.6"></script>
<script src="bots.js?v=0.6"></script>
<script>
(function () {
  'use strict';
  var AB = window.AB, Bots = window.Bots, CFG = AB.CFG;
  var $ = document.getElementById('app');
  var lib = null, run = null, report = null, timer = null, track = null;
  var LIB_SIZE = 80, LIB_SEED = 777, FRAME_MS = 90; // frames per step come from schedule()
  var ZONE = ['#3fb950', '#a3d535', '#f0c000', '#ff7b2e', '#f85149', '#f85149']; // wear zone colors: marks passed 0..4, over 100%

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function pad(s, n) { s = String(s); while (s.length < n) s += ' '; return s.slice(0, n); }
  function padL(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }

  // ---------- storage (may be unavailable) ----------
  var KEY = 'ab_stats_v1', SAVE_KEY = 'ab_save_v1';
  function defaultStats() { return { runs: 0, wins: 0, bestScore: 0, bestRound: 0, raceN: 0, placeSum: 0, champN: 0, champSum: 0 }; }
  function loadStats() { try { return Object.assign(defaultStats(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return defaultStats(); } }
  function saveStats(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function persist() { try { if (run && run.phase === 'shop') localStorage.setItem(SAVE_KEY, AB.serialize(run)); } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function readSave() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }

  // ---------- helpers ----------
  function label(car) { return car.player ? '@' : String(car.id); }
  function teamColor(car) { return AB.colorOf(car.id).c; } // fixed per team, the player is green
  function chips(p) { // tier badge (rarity colors) + archetype name
    if (p.t === 0) return '<span class="tc t0">Stock</span>';
    return '<span class="tc t' + p.t + '">T' + p.t + '</span><span class="at">' + esc(AB.archInfo(p.s, p.a).name) + '</span>';
  }
  function partLine(p) { // compact colored line used in team details
    var xp = AB.expText(p);
    return '<div class="pl k-' + p.s + '"><span class="sn">' + AB.SLOT_NAME[p.s] + '</span>' + chips(p) + '<div><b>' + esc(AB.partName(p)) + '<span class="star">' + AB.stars(p) + '</span></b></div>' +
      '<div class="d">' + esc(AB.describe(p)) + '</div>' + (xp ? '<div class="xp">' + esc(xp) + '</div>' : '') + '</div>';
  }
  function slotBlock(p, canSell) {
    var sell = (canSell && p.t > 0) ? '<button class="sell" data-act="sell" data-s="' + p.s + '">Sell +' + AB.sellValue(p) + '</button>' : '';
    return '<div class="blk mine k-' + p.s + '"><div class="bh"><span><span class="sn">' + AB.SLOT_NAME[p.s] + '</span>' + chips(p) + '</span>' + sell + '</div>' +
      '<span class="pn">' + esc(AB.partName(p)) + '<span class="star">' + AB.stars(p) + '</span></span><div class="d">' + esc(AB.describe(p)) + '</div>' +
      (AB.expText(p) ? '<div class="xp">' + esc(AB.expText(p)) + '</div>' : '') + '</div>';
  }
  var RISK_COL = { LOW: '#3fb950', MEDIUM: '#f0c000', HIGH: '#ff7b2e', EXTREME: '#f85149' };
  function forecastHTML() {
    var f = AB.forecast(run.build, run.round), mine = f.mid.fin ? f.mid.x : 99, faster = 0, n = 0;
    run.field.forEach(function (c) {
      if (c.player || !c.alive) return;
      var o = AB.forecast(c.career.builds[run.round - 1], run.round);
      n++; if (mine < (o.mid.fin ? o.mid.x : 99)) faster++;
    });
    var pace = !n ? '' : faster >= n * 2 / 3 ? 'front of the field' : faster >= n / 3 ? 'midfield' : 'back of the field';
    var trouble = { LOW: 'should hold up fine', MEDIUM: 'might give you a problem', HIGH: 'will probably give you trouble', EXTREME: 'could easily end your race' }[f.risk];
    return { line: '<div class="fline">Pace <b>' + pace + '</b> · Tire risk <b style="color:' + RISK_COL[f.risk] + '">' + f.risk + '</b></div>',
      detail: '<div class="fc">Your tires ' + trouble + '.' + (f.overheat ? ' <span style="color:#f85149">At full push they won’t last the whole race.</span>' : '') + ' <span class="dim">Pace assumes your tires hold.</span></div>' };
  }
  function standingsTable() {
    var st = AB.standings(run), h = '<table><tr><th>#</th><th>Team</th><th class="n">Pts</th></tr>';
    st.forEach(function (c, i) {
      h += '<tr class="' + (c.player ? 'you' : '') + (c.alive ? '' : ' out') + '"><td>' + (i + 1) + '</td><td><span style="color:' + teamColor(c) + '">' + esc(label(c)) + '</span> ' + esc(c.name) + '</td><td class="n">' + c.points + '</td></tr>';
    });
    return h + '</table>';
  }

  // ---------- start screen ----------
  function showStart() {
    var s = loadStats(), saved = readSave();
    var avgRace = s.raceN ? (s.placeSum / s.raceN).toFixed(2) : '-', avgChamp = s.champN ? (s.champSum / s.champN).toFixed(2) : '-';
    var h = '<h1>Racing Auto Battler <span class="dim" style="font-size:12px">v' + AB.VERSION + '</span></h1>' +
      '<p class="dim">Build a racing team out of six math functions, then race 9 rounds against 9 recorded rival cars. The last-placed team is cut after rounds 2, 4, 6 and 8.</p>';
    if (saved) h += '<button class="big" data-act="resume" style="background:var(--good);border-color:var(--good);color:#04200a">Resume championship</button>';
    h += '<button class="' + (saved ? '' : 'big') + '" data-act="new" style="width:100%">New Championship</button>' +
      '<details><summary>How it works</summary>' +
      '<p>Each round: shop, then race. Every car adds its output each step; first to the finish line total wins.</p>' +
      '<p><b style="color:var(--engine)">Engine</b> makes power, <b style="color:var(--design)">Design</b> multiplies it, <b style="color:var(--tires)">Tires</b> have a limit: push the engine past it and you risk a puncture, a blowout or a crash. <b style="color:var(--handling)">Handling</b> and <b style="color:var(--pilot)">Pilot</b> shape the dice. <b style="color:var(--marketing)">Marketing</b> earns credits and rerolls.</p>' +
      '<p>Every car has a top speed, and builds decide how fast it gets there. Tires wear as you push the engine, and the more worn they are, the likelier trouble gets: a puncture costs half your speed, a blowout sends you to the pits for fresh tires (you restart slowly), and a crash ends your race. The shop forecast tells you your pace and tire risk.</p>' +
      '<p>Buying the exact same part you own (same archetype and tier) upgrades it, up to 3 stars, for 75% of its price, and keeps its experience. Upgraded parts season every race and grow; pilots always gain experience. Buying a different part for a slot trades the old one in for half of what you paid. You can also sell a part for half of what you paid.</p>' +
      '<p><b style="color:var(--marketing)">Marketing</b>: Sponsors pay the most credits and a signing bonus, Scouts add shop offers and rerolls, Brand improves shop tiers and pays prize money for every point you score.</p>' +
      '<p>Lock the shop to keep its offers for next round (free, unlock any time).</p>' +
      '<p>Points (F1 style): 25, 18, 15, 12, 10, 8, 6, 4, 2, 1. A crash scores 0. Your game saves itself after every shop action.</p></details>' +
      '<h2>Your stats</h2><table>' +
      '<tr><td>Championships finished</td><td class="n">' + s.runs + '</td></tr>' +
      '<tr><td>Championship wins</td><td class="n">' + s.wins + '</td></tr>' +
      '<tr><td>Highest score</td><td class="n">' + s.bestScore + '</td></tr>' +
      '<tr><td>Highest round reached</td><td class="n">' + s.bestRound + '</td></tr>' +
      '<tr><td>Avg race placement</td><td class="n">' + avgRace + '</td></tr>' +
      '<tr><td>Avg championship placement</td><td class="n">' + avgChamp + '</td></tr></table>';
    $.innerHTML = h;
  }

  // ---------- shop ----------
  function showShop(msg, isErr) {
    var T = CFG.thresholds[run.round - 1], alive = run.field.filter(function (c) { return c.alive; }).length;
    var fc = forecastHTML();
    var h = '<div class="sticky"><div class="top"><b>Round ' + run.round + '/' + CFG.rounds + ' · Shop</b><span class="dim">Finish line ' + T + '</span></div>' +
      '<div class="bar"><span>Credits <b>' + run.credits + '</b></span><span>Rerolls <b>' + run.rerollsLeft + '</b></span><span>Cars <b>' + alive + '</b></span></div>' + fc.line + '</div>' + fc.detail;
    if (msg) h += '<div class="msg' + (isErr ? ' err' : '') + '">' + esc(msg) + '</div>';
    h += '<h2 class="mine">Your car</h2>';
    AB.SLOTS.forEach(function (s) { h += slotBlock(run.build[s], true); });
    h += '<h2 class="shop">Shop offers</h2>';
    if (!run.offers.length) h += '<p class="dim">Sold out. Reroll for new offers or head to the race.</p>';
    run.offers.forEach(function (off, i) {
      var k = AB.classify(run.build, off), own = run.build[off.s], shown, tag;
      if (k.kind === 'upgrade') { shown = AB.applyPurchase(run.build, off)[off.s]; tag = '<div class="tag up">UPGRADE → ' + '★'.repeat(shown.u) + ' (keeps its experience)</div>'; }
      else { shown = AB.newPart(off.s, off.a, off.t); tag = '<div class="tag rep">' + (k.kind === 'maxed' ? 'MAXED OUT' : 'replaces ' + esc(AB.partName(own)) + AB.stars(own) + (k.trade ? ' · trade-in +' + k.trade + ' cr' : '') + (k.bonus ? ' · signing bonus +' + k.bonus + ' cr' : '')) + '</div>'; }
      var dis = (k.kind === 'maxed' || k.cost > run.credits) ? ' disabled' : '';
      h += '<div class="blk shop k-' + off.s + '"><div class="bh"><span><span class="sn">' + AB.SLOT_NAME[off.s] + '</span>' + chips(shown) + '</span></div>' +
        '<span class="pn">' + esc(AB.partName(shown)) + '<span class="star">' + AB.stars(shown) + '</span></span>' +
        '<div class="d">' + esc(AB.describe(shown)) + '</div>' + tag +
        '<button class="buy" data-act="buy" data-i="' + i + '"' + dis + '>' + (k.kind === 'maxed' ? 'Maxed' : k.cost < 0 ? 'Swap · get ' + (-k.cost) + ' cr' : 'Buy · ' + k.cost + ' cr') + '</button></div>';
    });
    h += '<div class="row"><button class="lock' + (run.locked ? ' on' : '') + '" data-act="lock">' + (run.locked ? '🔒 Locked' : '🔓 Lock shop') + '</button>' +
      '<button data-act="reroll"' + (run.rerollsLeft > 0 && !run.locked ? '' : ' disabled') + '>' + (run.locked ? 'Unlock to reroll' : 'Reroll (' + run.rerollsLeft + ')') + '</button></div>' +
      (run.locked ? '<p class="dim" style="margin:0 0 6px">These offers come back next round. Tap Locked to unlock any time.</p>' : '') +
      '<button class="big go" data-act="race" style="margin-top:4px">Race! ▶</button>' +
      '<details><summary>Championship standings</summary>' + standingsTable() + '</details>' +
      '<button data-act="home" style="width:100%">Menu (your game is saved)</button>';
    $.innerHTML = h;
  }

  // ---------- race view: ASCII oval with 3 lanes ----------
  function makeTrack() {
    var W = 49, H = 19, cx = 24, cy = 9, lanes = [], steps = 1500;
    for (var k = 0; k < 3; k++) {
      var rx = 23.4 - 2.4 * k, ry = 8.6 - k, cells = [];
      for (var i = 0; i <= steps; i++) {
        var a = Math.PI / 2 + 2 * Math.PI * i / steps;
        var c = Math.round(cx + rx * Math.cos(a)), r = Math.round(cy + ry * Math.sin(a)), key = r * W + c;
        if (cells.length && cells[cells.length - 1][2] === key) continue;
        cells.push([c, r, key]);
      }
      if (cells.length > 1 && cells[cells.length - 1][2] === cells[0][2]) cells.pop();
      lanes.push(cells);
    }
    return { W: W, H: H, lanes: lanes };
  }
  // Playback schedule: early steps are quick, late steps slow, and events / the player's milestone rolls get slow motion.
  function schedule(rows, T) {
    var maxL = 0, n = [], starts = [], sum = 0, me = null;
    rows.forEach(function (r) { maxL = Math.max(maxL, r.res.totals.length - 1); if (r.car.player) me = r; });
    for (var s = 0; s < maxL; s++) {
      var lead = 0;
      rows.forEach(function (r) { var tt = r.res.totals; lead = Math.max(lead, tt[Math.min(s, tt.length - 1)] / T); });
      lead = Math.min(1, lead);
      var ev = rows.some(function (r) { return r.res.events.some(function (e) { return e.x === s + 1; }); });
      var ms = me && me.res.events.some(function (q) { return q.x === s + 1; });
      var k = lead >= 1 ? 8 : 4 + Math.round(8 * lead) + (ev ? 6 : 0) + (ms ? 6 : 0); // steady pace after the leader finishes
      starts.push(sum); n.push(k); sum += k;
    }
    return { n: n, starts: starts, total: sum, steps: maxL };
  }
  function where(sch, f) { // frame -> { s: step index, fr: fraction through the step }
    var s = 0;
    while (s < sch.steps - 1 && f >= sch.starts[s + 1]) s++;
    return { s: s, fr: Math.min(1, (f - sch.starts[s]) / sch.n[s]) };
  }
  function carState(row, w) {
    var r = row.res, tt = r.totals, L = tt.length - 1, s = w.s, i0 = Math.min(s, L), i1 = Math.min(s + 1, L);
    var a = tt[i0], b = tt[i1], wa = r.wr[i0], wb = r.wr[i1];
    return { s: s, L: L, tot: a + (b - a) * w.fr, code: r.st[i0], wear: wa + (wb - wa) * w.fr };
  }
  function zoneOf(wear) { var z = 0; CFG.wear.marks.forEach(function (m) { if (wear >= m) z++; }); return wear >= 100 ? 5 : z; }
  function trackHTML(rows, T, w) {
    var W = track.W, H = track.H, grid = [], i;
    for (i = 0; i < H * W; i++) grid.push(' ');
    track.lanes.forEach(function (cells) {
      cells.forEach(function (c, n) { grid[c[2]] = n === 0 ? '<span class="fl">|</span>' : '<span class="tk">.</span>'; });
    });
    var items = rows.map(function (row) {
      var st = carState(row, w), cells = track.lanes[row.car.id % track.lanes.length], p = Math.min(1, st.tot / T);
      return { p: p, cell: cells[Math.min(cells.length - 1, Math.floor(p * cells.length))], code: st.code, car: row.car, crashed: row.res.status === 'crash' && st.s >= st.L };
    });
    items.sort(function (x, y) { return (x.crashed ? -1 : 0) - (y.crashed ? -1 : 0) || x.p - y.p || (x.car.player ? 1 : 0) - (y.car.player ? 1 : 0); });
    items.forEach(function (it) {
      var cls = 'c' + (it.car.player ? ' me' : '') + (it.code ? ' s' + it.code : '');
      grid[it.cell[2]] = '<span class="' + cls + '" style="color:' + (it.crashed ? '#f85149' : teamColor(it.car)) + '">' + (it.crashed ? 'X' : esc(label(it.car))) + '</span>';
    });
    var out = '';
    for (i = 0; i < H; i++) out += grid.slice(i * W, (i + 1) * W).join('') + (i < H - 1 ? '\n' : '');
    return out;
  }
  function liveHTML(rows, T, w) {
    var list = rows.map(function (row) {
      var st = carState(row, w), r = row.res, p = Math.min(1, st.tot / T), mark = ' ';
      var fin = r.status === 'fin' && st.s >= st.L, dead = r.status === 'crash' && st.s >= st.L;
      if (fin) mark = '✓'; else if (dead) mark = 'X'; else if (st.code === 1) mark = '~'; else if (st.code === 2) mark = 'P';
      return { row: row, p: p, mark: mark, fin: fin, dead: dead, wear: st.wear };
    });
    list.sort(function (x, y) { return (y.fin ? 1 : 0) - (x.fin ? 1 : 0) || (x.fin && y.fin ? x.row.pos - y.row.pos : y.p - x.p); });
    return list.map(function (it, i) {
      var car = it.row.car, dot = it.dead ? ' ' : '<span style="color:' + ZONE[zoneOf(it.wear)] + '">●</span>';
      return padL(i + 1, 2) + '. <span style="color:' + teamColor(car) + ';font-weight:700">' + esc(label(car)) + '</span> ' + esc(pad(car.name, 17)) + padL(Math.round(it.p * 100), 4) + '% ' + it.mark + ' ' + dot;
    }).join('\n');
  }
  var EV_TXT = { puncture: 'Puncture: lost half your speed', pit: 'Blowout! Pit stop for fresh tires', crash: 'Crashed out' };
  var EV_SHORT = { puncture: 'puncture', pit: 'pit stop', crash: 'crash' };
  function tireWord(wear) { return wear >= 100 ? 'OVERHEATING' : wear >= 80 ? 'critical' : wear >= 60 ? 'risky' : wear >= 40 ? 'worn' : wear >= 20 ? 'used' : 'fresh'; }
  function wearHTML(me, w) { // the player's live tire gauge: no numbers to decode, only what happened
    var st = carState(me, w), wear = Math.max(0, st.wear), z = zoneOf(wear);
    var shown = me.res.events.filter(function (q) { return q.x - 1 < w.s || (q.x - 1 === w.s && w.fr >= 0.5); });
    var log = shown.map(function (q) { return '<div class="r-' + q.type + '">' + EV_TXT[q.type] + '</div>'; }).join('');
    return '<div class="wrow"><b>Your tires</b><span style="color:' + ZONE[z] + ';font-weight:700">' + tireWord(wear) + '</span></div>' +
      '<div class="wbar"><div class="wfill" style="width:' + Math.min(100, wear) + '%;background:' + ZONE[z] + '"></div></div>' +
      '<div class="wlog">' + log + '</div>';
  }
  function resultsHTML(rep) {
    var rows = rep.rows.slice().sort(function (a, b) { return a.pos - b.pos; });
    var h = '<h2>Result · tap a team to see its car</h2>';
    rows.forEach(function (r) {
      var res = r.res, txt = res.status === 'fin' ? 'x ' + res.x.toFixed(1) : res.status === 'crash' ? 'CRASH x' + res.x : 'cap';
      var evs = res.events.map(function (q) { return '<span class="r-' + q.type + '">' + EV_SHORT[q.type] + '</span>'; });
      h += '<details class="team' + (r.car.player ? ' you' : '') + '"><summary><span class="pos">' + r.pos + '</span><span class="nm"><span style="color:' + teamColor(r.car) + ';font-weight:700">' + esc(label(r.car)) + '</span> ' + esc(r.car.name) + '</span><span>' + txt + '</span><span class="pts">+' + r.pts + '</span></summary>' +
        '<p class="dim">Pilot rolled ' + Math.round(res.roll * 100) + '%.</p><p>Tires: ' + (evs.length ? evs.join(' · ') : 'no trouble') + '</p>';
      AB.SLOTS.forEach(function (s) { h += partLine(r.build[s]); });
      h += '</details>';
    });
    if (rep.eliminated) h += '<div class="msg' + (rep.eliminated.player ? ' err' : '') + '">' + (rep.eliminated.player ? 'You finished last in the standings and are eliminated.' : esc(rep.eliminated.name) + ' is eliminated.') + '</div>';
    h += '<h2>Championship standings</h2>' + standingsTable();
    var btn = run.phase === 'dead' ? 'See result' : run.phase === 'finished' ? 'Finish championship' : 'Next: round ' + (run.round + 1) + ' shop';
    h += '<button class="big" data-act="after">' + btn + '</button>';
    return h;
  }
  function showRace(rep) {
    if (!track) track = makeTrack();
    var rows = rep.rows, sch = schedule(rows, rep.T), f = 0, me = rows.filter(function (r) { return r.car.player; })[0];
    $.innerHTML = '<div class="top"><b>Round ' + rep.round + ' · Race</b><span class="dim">Finish line ' + rep.T + '</span></div>' +
      '<pre id="track"></pre><div id="wear"></div><pre id="live"></pre><div id="ctl" class="row"><button data-act="skip">Skip ▶▶</button></div><div id="after"></div>' +
      '<p class="dim">@ is you (green); every rival team keeps its own color. Dots show tire wear, green fresh to red worn out. Track tint: yellow ~ puncture, orange P pit stop, red X crash, ✓ finished.</p>';
    var tEl = document.getElementById('track'), lEl = document.getElementById('live'), wEl = document.getElementById('wear');
    var avail = tEl.clientWidth - 10; // fit the 49-column track to this phone's width
    tEl.style.fontSize = Math.max(8, Math.min(13, avail / (track.W * 0.6))).toFixed(1) + 'px';
    function draw() {
      var w = where(sch, f);
      tEl.innerHTML = trackHTML(rows, rep.T, w); lEl.innerHTML = liveHTML(rows, rep.T, w); wEl.innerHTML = wearHTML(me, w);
    }
    function finish() {
      clearInterval(timer); timer = null; f = sch.total; draw();
      document.getElementById('ctl').style.display = 'none';
      document.getElementById('after').innerHTML = resultsHTML(rep);
    }
    showRace.skip = finish;
    draw();
    timer = setInterval(function () { f++; if (f >= sch.total) finish(); else draw(); }, FRAME_MS);
  }

  // ---------- end of run ----------
  function finishRun() {
    if (run.statsDone) return; run.statsDone = true;
    var s = loadStats(), me = run.field[0];
    s.runs++; s.champN++; s.champSum += run.finalRank;
    if (run.phase === 'finished' && run.finalRank === 1) s.wins++;
    s.bestScore = Math.max(s.bestScore, me.points);
    s.bestRound = Math.max(s.bestRound, run.history.length);
    saveStats(s);
  }
  function showEnd() {
    finishRun();
    var me = run.field[0], won = run.phase === 'finished' && run.finalRank === 1;
    var h = '<h1>' + (run.phase === 'dead' ? 'Eliminated' : won ? 'Champions!' : 'Championship complete') + '</h1>';
    h += '<p class="big-result">' + (run.phase === 'dead' ? 'Cut after round ' + run.history.length + ' with ' + me.points + ' points.' : 'Final place: ' + run.finalRank + ' of ' + CFG.fieldSize + ' with ' + me.points + ' points.') + '</p>';
    h += '<h2>Your races</h2><table><tr><th>Round</th><th>Place</th><th class="n">Pts</th></tr>';
    run.history.forEach(function (r) { h += '<tr><td>' + r.round + '</td><td>' + r.pos + (r.status === 'crash' ? ' (crash)' : '') + '</td><td class="n">' + r.pts + '</td></tr>'; });
    h += '</table><h2>Final standings</h2>' + standingsTable();
    h += '<h2 class="mine">Your final car</h2>';
    AB.SLOTS.forEach(function (s) { h += slotBlock(run.build[s], false); });
    h += '<button class="big" data-act="new">New Championship</button><button data-act="home" style="width:100%">Stats</button>';
    $.innerHTML = h;
  }

  // ---------- actions ----------
  function startNew() {
    run = AB.newChampionship((Date.now() % 1000000007) | 0, lib);
    persist(); showShop(); window.scrollTo(0, 0);
  }
  var actions = {
    new: function () {
      if (readSave() && !window.confirm('Abandon your current championship and start a new one?')) return;
      startNew();
    },
    resume: function () {
      if (!(run && run.phase === 'shop')) run = AB.restore(readSave() || '', lib);
      if (run) showShop('Championship resumed.'); else { clearSave(); showStart(); }
      window.scrollTo(0, 0);
    },
    home: function () { persist(); showStart(); },
    buy: function (d) {
      var i = +d.i, off = run.offers[i], name = off ? AB.partName(off) : '', r = AB.buy(run, i);
      if (r.ok) { persist(); showShop((r.kind === 'upgrade' ? 'Upgraded ' : 'Bought ') + name + (r.trade ? ' (trade-in +' + r.trade + ' cr), net ' + r.cost + ' cr.' : ' for ' + r.cost + ' cr.')); }
      else showShop(r.why, true);
    },
    sell: function (d) {
      var p = run.build[d.s];
      if (!p || p.t === 0) return;
      if (!window.confirm('Sell ' + AB.partName(p) + AB.stars(p) + ' for ' + AB.sellValue(p) + ' cr? The slot goes back to the stock part.')) return;
      var r = AB.sell(run, d.s);
      if (r.ok) { persist(); showShop('Sold ' + r.name + ' for ' + r.value + ' cr.'); }
    },
    reroll: function () { if (AB.reroll(run)) { persist(); showShop('Offers rerolled.'); } },
    lock: function () { AB.setLock(run, !run.locked); persist(); showShop(run.locked ? 'Shop locked: these offers will be waiting next round.' : 'Shop unlocked.'); },
    race: function () { report = AB.race(run); showRace(report); window.scrollTo(0, 0); }, // not saved: a reload replays the same race from the shop
    skip: function () { if (showRace.skip) showRace.skip(); },
    after: function () {
      var s = loadStats(); s.raceN++; s.placeSum += report.playerPos; saveStats(s);
      if (run.phase === 'dead' || run.phase === 'finished') { clearSave(); showEnd(); }
      else {
        AB.next(run); persist();
        var notes = [];
        if (run.prizeLast > 0) notes.push('Brand prize money: +' + run.prizeLast + ' cr.');
        if (run.lockedIn) notes.push('Your locked offers are back.');
        showShop(notes.join(' '));
      }
      window.scrollTo(0, 0);
    }
  };
  $.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    actions[b.getAttribute('data-act')]({ i: b.getAttribute('data-i'), s: b.getAttribute('data-s') });
  });

  setTimeout(function () {
    lib = Bots.buildLibrary(LIB_SIZE, LIB_SEED);
    var saved = readSave();
    run = saved ? AB.restore(saved, lib) : null;
    if (run) showShop('Championship resumed.');
    else { if (saved) clearSave(); showStart(); }
  }, 30);
})();
</script>
</body>
</html>
