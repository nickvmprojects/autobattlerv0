<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Auto Battler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap">
<style>
  :root { --bg:#0a0d18; --panel:#151b2c; --row:#05070d; --line:#252d45; --text:#eef0f6; --dim:#9aa3b8; --acc:#ff9e1b; --red:#e8203a; --good:#3ddc6f; --warn:#ffd23f; --bad:#ff4d61;
    --engine:#ff5a5f; --design:#4f86ff; --tires:#ffd23f; --handling:#2fd1c0; --pilot:#b06bff; --marketing:#ff7ac0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.3 'Barlow Condensed', 'Arial Narrow', sans-serif; }
  #app { max-width:480px; margin:0 auto; padding:12px 12px 40px; }
  .sk { transform:skewX(-8deg); }
  .it { font-style:italic; }
  h1 { font-size:30px; margin:8px 0 2px; font-style:italic; font-weight:700; letter-spacing:.02em; text-transform:uppercase; }
  h1 .o { color:var(--acc); }
  h2 { font-size:15px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin:18px 0 8px; font-style:italic; }
  p { margin:6px 0; }
  .dim { color:var(--dim); }
  button { font:inherit; font-weight:700; font-style:italic; text-transform:uppercase; letter-spacing:.04em; color:var(--text); background:#1d2438; border:0; padding:10px 14px; min-height:44px; cursor:pointer; transform:skewX(-8deg); }
  button:active { filter:brightness(1.2); }
  button:disabled { opacity:.35; cursor:default; }
  button.big { width:100%; background:var(--red); color:#fff; font-size:20px; margin:10px 0; }
  button.go { background:var(--acc); color:#0a0d18; }
  button.sell { min-height:30px; padding:2px 10px; font-size:13px; background:#2a1622; color:#ffb3cf; }
  .row { display:flex; gap:10px; margin:10px 0; } .row button { flex:1; }
  .hdr { display:flex; justify-content:space-between; align-items:center; background:var(--red); color:#fff; padding:6px 12px; font-weight:700; font-style:italic; font-size:19px; letter-spacing:.04em; text-transform:uppercase; }
  .bar { display:flex; justify-content:space-between; gap:8px; background:var(--row); border-top:3px solid var(--acc); padding:6px 10px; margin:6px 0; font-weight:600; font-style:italic; text-transform:uppercase; }
  .bar b { color:var(--acc); }
  .fline { font-size:15px; margin:2px 2px 4px; font-weight:600; font-style:italic; text-transform:uppercase; }
  .sticky { position:sticky; top:0; z-index:5; background:var(--bg); padding:6px 0 2px; margin:-6px 0 0; }
  .msg { background:#11261a; border-left:0; padding:6px 10px; margin:8px 0; color:#b9f5c9; font-weight:600; }
  .msg.err { background:#2a1119; color:#ffc0c8; }
  .fc { background:var(--panel); padding:8px 10px; margin:6px 0; font-size:15px; }
  /* part cards */
  .card { background:var(--panel); padding:10px; margin:8px 0; display:flex; flex-direction:column; gap:6px; }
  .card.mine { background:#111727; padding:8px 10px; margin:6px 0; }
  .ch { display:flex; align-items:center; gap:10px; }
  .ico { width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#0a0d18; border:2px solid var(--k); transform:skewX(-8deg); }
  .card.mine .ico { width:32px; height:32px; }
  .cn { flex-grow:1; min-width:0; }
  .sn { color:var(--k); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-style:italic; }
  .pn { font-size:21px; font-weight:700; font-style:italic; text-transform:uppercase; line-height:1.05; }
  .card.mine .pn { font-size:18px; }
  .star { color:var(--acc); }
  .tc { display:inline-block; font-size:12px; font-weight:700; padding:0 6px; margin-left:6px; vertical-align:2px; font-style:normal; }
  .tc.t0 { color:#9aa3b8; border:1px solid #9aa3b8; } .tc.t1 { color:#0a0d18; background:#c9d1e0; } .tc.t2 { color:#04200a; background:#3ddc6f; } .tc.t3 { color:#fff; background:#2f6bff; } .tc.t4 { color:#2a1a00; background:#ffb000; }
  .d { color:var(--dim); font-size:14px; line-height:1.2; }
  .xp { color:#9fd0ff; font-size:13px; }
  .stats { display:flex; flex-direction:column; gap:3px; }
  .st { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; font-style:italic; text-transform:uppercase; }
  .st .l { width:104px; flex-shrink:0; white-space:nowrap; }
  .pips { display:flex; gap:3px; }
  .pip { width:12px; height:12px; border-radius:50%; border:2px solid #3a4562; background:transparent; }
  .pip.on { border-color:var(--acc); background:var(--acc); }
  .pip.bad { border-color:var(--bad); background:var(--bad); }
  .card.mine .pip { width:10px; height:10px; }
  .tag { font-size:14px; font-weight:700; font-style:italic; text-transform:uppercase; }
  .tag.up { color:var(--good); } .tag.rep { color:var(--dim); }
  .vs { font-size:14px; font-weight:600; font-style:italic; }
  .vs .p { color:var(--good); } .vs .m { color:var(--bad); }
  .card button.buy { width:100%; background:var(--red); color:#fff; font-size:18px; }
  .card button.buy:disabled { background:#2a3046; }
  button.lock.on { background:var(--acc); color:#0a0d18; }

  canvas { display:block; width:100%; background:var(--panel); }
  #ann { display:flex; gap:10px; align-items:stretch; margin:8px 0; }

  .aname { font-size:13px; font-weight:700; font-style:italic; letter-spacing:.1em; color:var(--acc); text-transform:uppercase; }
  .aline { font-size:17px; font-weight:600; font-style:italic; text-transform:uppercase; line-height:1.15; }
  .aline.me { color:var(--good); }
  .aold { font-size:13px; color:var(--dim); font-style:italic; }

  #alog div { margin:2px 0; } #alog .me { color:var(--good); font-weight:700; } #alog .t { color:var(--dim); margin-right:6px; font-size:13px; }
  .lbl { font-size:14px; font-weight:700; font-style:italic; letter-spacing:.12em; color:var(--acc); text-transform:uppercase; margin:8px 0 4px; }
  .tower { display:flex; flex-direction:column; gap:3px; }
  .tr { display:flex; align-items:center; gap:7px; background:var(--row); padding:2px 8px; font-weight:700; font-style:italic; font-size:16px; transform:skewX(-8deg); text-transform:uppercase; }
  .tr.me { background:var(--acc); color:#0a0d18; }
  .tr .ps { width:18px; color:var(--acc); } .tr.me .ps { color:#0a0d18; }
  .tr .cb { width:4px; height:16px; }
  .tr .nm { flex-grow:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr .gp { font-weight:600; }
  .tr .ev { width:18px; text-align:center; }
  .tr.out { opacity:.45; }
  .wrow { display:flex; justify-content:space-between; font-size:15px; font-weight:600; font-style:italic; text-transform:uppercase; }
  .wbar { position:relative; height:12px; background:#1d2438; overflow:hidden; margin:3px 0 4px; transform:skewX(-8deg); }
  .wfill { height:100%; }
  #wear { background:var(--panel); padding:8px 10px; margin:8px 0; }
  .wlog { font-size:14px; font-style:italic; }
  .r-puncture { color:var(--warn); } .r-bounce { color:#c89bff; } .r-pit { color:var(--acc); } .r-crash, .r-spin { color:var(--bad); font-weight:700; } .r-turn { color:#c89bff; }
  table { width:100%; border-collapse:collapse; font-size:16px; font-style:italic; }
  td, th { padding:4px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--acc); text-transform:uppercase; font-size:13px; letter-spacing:.08em; }
  td.n, th.n { text-align:right; }
  tr.you td { color:var(--acc); font-weight:700; }
  tr.out td { color:var(--dim); text-decoration:line-through; }
  details { background:var(--panel); padding:8px 10px; margin:6px 0; }
  details.team.you { outline:2px solid var(--acc); }
  summary { cursor:pointer; font-weight:600; font-style:italic; }
  details.team > summary { display:flex; gap:8px; text-transform:uppercase; }
  details.team .pos { width:20px; text-align:right; color:var(--acc); }
  details.team .nm { flex:1; }
  details.team .pts { color:var(--acc); }
  .new { background:var(--good); color:#04200a; font-size:12px; font-weight:700; padding:0 6px; margin-left:6px; font-style:normal; }
  details.wn ul { margin:6px 0; padding-left:18px; } details.wn li { margin:3px 0; font-size:15px; }
  details.wn > summary { color:var(--acc); text-transform:uppercase; }
  select { font:inherit; color:var(--text); background:#1d2438; border:0; padding:4px 8px; font-size:20px; }
  .big-result { font-size:22px; font-style:italic; font-weight:700; text-transform:uppercase; }
  .pl { padding:4px 0; border-bottom:1px solid var(--line); }
  .circ { background:var(--panel); padding:8px 10px; margin:6px 0 2px; box-shadow:inset 4px 0 0 var(--c); }
  .cnext { font-size:13px; font-weight:700; font-style:italic; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .cname { font-size:22px; font-weight:700; font-style:italic; text-transform:uppercase; color:var(--c); line-height:1.05; }
  .cfx { font-size:16px; font-weight:600; font-style:italic; }
  .cthen { font-size:15px; font-style:italic; margin:2px 0 6px; padding:0 10px; }
</style>
</head>

      done = true; f = sch.total; var w = where(sch, sch.total); drawHTML(w);
      document.getElementById('ctl').style.display = 'none';
      document.getElementById('after').innerHTML = '<div class="lbl">All calls</div><div id="alog">' + calls.map(function (c) { return '<div class="' + (c.me ? 'me' : '') + '"><span class="t">' + c.ts + '</span>' + esc(c.txt) + '</div>'; }).join('') + '</div>' + resultsHTML(rep);
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(frame);
    }
    showRace.skip = function () { if (!done) { t0 = performance.now() - lightsEnd - sch.total * FRAME_MS; finish(); } };
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }

  // ---------- end of run ----------
  function finishRun() {
    if (run.statsDone) return; run.statsDone = true;
    var s = loadStats(), me = run.field[0];
    s.runs++; s.champN++; s.champSum += run.finalRank;
    if (run.phase === 'finished' && run.finalRank === 1) s.wins++;
    s.bestScore = Math.max(s.bestScore, me.points); s.bestRound = Math.max(s.bestRound, run.history.length);
    saveStats(s);
  }
  function showEnd() {
    stopRace(); finishRun();
    var me = run.field[0], won = run.phase === 'finished' && run.finalRank === 1;
    var h = '<div class="hdr sk"><span>' + (run.phase === 'dead' ? 'Eliminated' : won ? 'Champions!' : 'Championship complete') + '</span></div>';
    h += '<p class="big-result">' + (run.phase === 'dead' ? 'Cut after round ' + run.history.length + ' with ' + me.points + ' points.' : 'Final place: ' + run.finalRank + ' of ' + CFG.fieldSize + ' with ' + me.points + ' points.') + '</p>';
    h += '<h2>Your races</h2><table><tr><th>Round</th><th>Place</th><th class="n">Pts</th></tr>';
    run.history.forEach(function (r) { h += '<tr><td>' + r.round + '</td><td>' + r.pos + (r.status === 'crash' ? ' (crash)' : '') + '</td><td class="n">' + r.pts + '</td></tr>'; });
    h += '</table><h2>Final standings</h2>' + standingsTable() + '<h2>Your final car</h2>';
    AB.SLOTS.forEach(function (s) { h += slotCard(run.build[s], false); });
    h += '<button class="big" data-act="new">New championship</button><button data-act="home" style="width:100%">Stats</button>';
    $.innerHTML = h;
  }
  function stopRace() { if (raf) cancelAnimationFrame(raf); raf = null; showRace.skip = null; }

  // ---------- actions ----------
  function startNew() { run = AB.newChampionship((Date.now() % 1000000007) | 0, lib); persist(); showShop(); window.scrollTo(0, 0); }
  var actions = {
    new: function () { if (readSave() && !window.confirm('Abandon your current championship and start a new one?')) return; stopRace(); startNew(); },
    resume: function () {
      if (!(run && run.phase === 'shop')) run = AB.restore(readSave() || '', lib);
      if (run) showShop('Championship resumed.'); else { clearSave(); showStart(); }
      window.scrollTo(0, 0);
    },
    home: function () { stopRace(); persist(); showStart(); },
    buy: function (d) {
      var i = +d.i, off = run.offers[i], name = off ? AB.partName(off) : '', r = AB.buy(run, i);
      if (r.ok) { persist(); showShop((r.kind === 'upgrade' ? 'Upgraded ' : 'Bought ') + name + (r.trade ? ' (trade-in +' + r.trade + ' cr), net ' + r.cost + ' cr.' : ' for ' + r.cost + ' cr.')); }
      else showShop(r.why, true);
    },
    sell: function (d) {
      var p = run.build[d.s]; if (!p || p.t === 0) return;
      if (!window.confirm('Sell ' + AB.partName(p) + AB.stars(p) + ' for ' + AB.sellValue(p) + ' cr? The slot goes back to the stock part.')) return;
      var r = AB.sell(run, d.s); if (r.ok) { persist(); showShop('Sold ' + r.name + ' for ' + r.value + ' cr.'); }
    },
    reroll: function () { if (AB.reroll(run)) { persist(); showShop('Offers rerolled.'); } },
    lock: function () { AB.setLock(run, !run.locked); persist(); showShop(run.locked ? 'Shop locked: these offers will be waiting next round.' : 'Shop unlocked.'); },
    race: function () { report = AB.race(run); showRace(report); window.scrollTo(0, 0); },
    skip: function () { if (showRace.skip) showRace.skip(); },
    after: function () {
      var s = loadStats(); s.raceN++; s.placeSum += report.playerPos; saveStats(s);
      stopRace();
      if (run.phase === 'dead' || run.phase === 'finished') { clearSave(); showEnd(); }
      else {
        AB.next(run); persist();
        var notes = [];
        if (run.prizeLast > 0) notes.push('Brand prize money: +' + run.prizeLast + ' cr.');
        if (run.lockedIn) notes.push('Your locked offers are back.');
        if (run.bookieLast > 0) notes.push('Bookie pays out: +' + run.bookieLast + ' cr!'); else if (run.bookieLast < 0) notes.push('Bookie collects: ' + run.bookieLast + ' cr.');
        showShop(notes.join(' '));
      }
      window.scrollTo(0, 0);
    }
  };
  $.addEventListener('change', function (e) { if (e.target.id === 'flagSel') { try { localStorage.setItem(FLAG_KEY, e.target.value); } catch (er) {} } });
  $.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    actions[b.getAttribute('data-act')]({ i: b.getAttribute('data-i'), s: b.getAttribute('data-s') });
  });

  setTimeout(function () {
    buildRefs();
    lib = Bots.buildLibrary(LIB_SIZE, LIB_SEED);
    var saved = readSave();
    run = saved ? AB.restore(saved, lib) : null;
    if (run) showShop('Championship resumed.'); else { if (saved) clearSave(); showStart(); }
  }, 30);
})();
</script>
</body>
</html>
