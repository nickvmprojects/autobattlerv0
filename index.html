<style>

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.3 'Barlow Condensed', 'Arial Narrow', sans-serif; }

  .dim { color:var(--dim); }

  .ch { display:flex; align-items:center; gap:10px; }

  .card.mine .ico { width:32px; height:32px; }
  .cn { flex-grow:1; min-width:0; }
  .sn { color:var(--k); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-style:italic; }
  .pn { font-size:21px; font-weight:700; font-style:italic; text-transform:uppercase; line-height:1.05; }
  .card.mine .pn { font-size:18px; }
  .star { color:var(--acc); }
  .tc { display:inline-block; font-size:12px; font-weight:700; padding:0 6px; margin-left:6px; vertical-align:2px; font-style:normal; }
  .tc.t0 { color:#9aa3b8; border:1px solid #9aa3b8; } .tc.t1 { color:#0a0d18; background:#c9d1e0; } .tc.t2 { color:#04200a; background:#3ddc6f; } .tc.t3 { color:#fff; background:#2f6bff; } .tc.t4 { color:#2a1a00; background:#ffb000; }
  .d { color:var(--dim); font-size:14px; line-height:1.2; }
  .xp { color:#9fd0ff; font-size:13px; }
  .stats { display:flex; flex-direction:column; gap:3px; }
  .st { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; font-style:italic; text-transform:uppercase; }
  .st .l { width:104px; flex-shrink:0; white-space:nowrap; }
  .pips { display:flex; gap:3px; }
  .imp { font-size:14px; margin:6px 0 2px; line-height:1.35; } .imp .ih { font-weight:800; letter-spacing:.5px; color:var(--acc); margin-right:2px; } .imp .p { color:var(--good); font-weight:700; } .imp .m { color:var(--bad); font-weight:700; }
  .pip { width:12px; height:12px; border-radius:50%; border:2px solid #3a4562; background:transparent; }
  .pip.on { border-color:var(--acc); background:var(--acc); }
  .pip.bad { border-color:var(--bad); background:var(--bad); }
  .card.mine .pip { width:10px; height:10px; }
  .tag { font-size:14px; font-weight:700; font-style:italic; text-transform:uppercase; }
  .tag.up { color:var(--good); } .tag.rep { color:var(--dim); }
  .vs { font-size:14px; font-weight:600; font-style:italic; }
  .vs .p { color:var(--good); } .vs .m { color:var(--bad); }

  button.lock.on { background:var(--acc); color:#0a0d18; }

  #ann { display:flex; gap:10px; align-items:stretch; margin:8px 0; }

  .ahead.on svg { animation:bob 1.6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) { .ahead.on .talk, .ahead.on svg { animation:none; } .ahead.on .talk { opacity:1; } }

  .tr .gp { font-weight:600; }
  .tr .ev { width:18px; text-align:center; }
  .tr.out { opacity:.45; }

  .wbar { position:relative; height:12px; background:#1d2438; overflow:hidden; margin:3px 0 4px; transform:skewX(-8deg); }
  .wfill { height:100%; }

  th { color:var(--acc); text-transform:uppercase; font-size:13px; letter-spacing:.08em; }
  td.n, th.n { text-align:right; }
  tr.you td { color:var(--acc); font-weight:700; }

  details.team.you { outline:2px solid var(--acc); }

  details.team > summary { display:flex; gap:8px; align-items:center; text-transform:uppercase; }
  details.team .pos { width:20px; text-align:right; color:var(--acc); }
  details.team .nm { flex:1; }
  details.team .pts { color:var(--acc); }
  .new { background:var(--good); color:#04200a; font-size:12px; font-weight:700; padding:0 6px; margin-left:6px; font-style:normal; }
  details.wn ul { margin:6px 0; padding-left:18px; } details.wn li { margin:3px 0; font-size:15px; }
  details.wn > summary { color:var(--acc); text-transform:uppercase; }
  select { font:inherit; color:var(--text); background:#1d2438; border:0; padding:4px 8px; font-size:20px; }
  .big-result { font-size:22px; font-style:italic; font-weight:700; text-transform:uppercase; }
  .face { display:inline-block; border-radius:50%; overflow:hidden; flex-shrink:0; vertical-align:middle; font-weight:700; font-style:italic; }
  .rtop { position:sticky; top:0; z-index:6; background:var(--bg); padding-bottom:4px; margin:0 -2px; }
  .abar { display:flex; gap:8px; align-items:center; background:var(--row); border-top:3px solid var(--acc); padding:4px 8px; margin:4px 0; height:62px; overflow:hidden; }
  .abar .atext { flex-grow:1; min-width:0; }
  .abar .aline { font-size:15px; line-height:1.15; height:2.3em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .ahead.sm { width:44px; height:44px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 2px; }
  .chip { font-size:13px; font-weight:700; font-style:italic; text-transform:uppercase; color:var(--c); border:1px solid var(--c); padding:0 6px; transform:skewX(-8deg); }
  .blk { background:var(--panel); margin:10px 0; padding:0 0 8px; }
  .bt { display:flex; justify-content:space-between; align-items:center; background:#1d2438; padding:4px 10px; font-size:14px; font-weight:700; font-style:italic; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin-bottom:6px; }
  .blk > :not(.bt) { margin-left:8px; margin-right:8px; }
  .blk canvas { width:calc(100% - 16px); }
  button.mini { min-height:28px; padding:0 10px; font-size:12px; background:#0a0d18; color:var(--acc); }
  .pl { padding:4px 0; border-bottom:1px solid var(--line); }
  .circ { background:var(--panel); padding:8px 10px; margin:6px 0 2px; box-shadow:inset 4px 0 0 var(--c); }
  .cnext { font-size:13px; font-weight:700; font-style:italic; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .cname { font-size:22px; font-weight:700; font-style:italic; text-transform:uppercase; color:var(--c); line-height:1.05; }
  .cfx { font-size:16px; font-weight:600; font-style:italic; }
  .cthen { font-size:15px; font-style:italic; margin:2px 0 6px; padding:0 10px; }
</style>

        if (crashed) flame(ctx, p.x, p.y - 2, ms / 1000);

        if (r.car.player) { ctx.fillStyle = '#3ddc6f'; ctx.fillRect(p.x - 13, p.y - 27, 26, 12); ctx.beginPath(); ctx.moveTo(p.x - 3, p.y - 15); ctx.lineTo(p.x + 3, p.y - 15); ctx.lineTo(p.x, p.y - 11); ctx.fill();
          ctx.font = 'italic 700 11px "Barlow Condensed", sans-serif'; ctx.fillStyle = '#04140a'; ctx.textAlign = 'center'; ctx.fillText('YOU', p.x, p.y - 17); }
      });
      if (lights > 0) {
        ctx.fillStyle = 'rgba(5,7,13,.85)'; ctx.fillRect(W / 2 - 52, H / 2 - 44, 104, 26);
        for (var i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(W / 2 - 40 + i * 20, H / 2 - 31, 7, 0, 7); ctx.fillStyle = lights === 6 ? '#16301f' : i < lights ? '#ff2a3d' : '#3a1820'; ctx.fill(); }
        if (lights === 6) { ctx.font = 'italic 700 26px "Barlow Condensed", sans-serif'; ctx.fillStyle = '#3ddc6f'; ctx.textAlign = 'center'; ctx.fillText('GO!', W / 2, H / 2 - 50); }
      }
    }
    function drawLanes(w, ms) {
      var LW = 358, LH = 100; lc.setTransform(2, 0, 0, 2, 0, 0); lc.fillStyle = '#151b2c'; lc.fillRect(0, 0, LW, LH);
      var mst = carState(me, w), my = mst.tot, span = lapLen * 0.18, scale = 130 / span, cx = 200;
      var near = rows.filter(function (r) { return r !== me; }).map(function (r) { return { r: r, st: carState(r, w) }; })
        .sort(function (a, b) { return Math.abs(a.st.tot - my) - Math.abs(b.st.tot - my); }).slice(0, 3);
      var list = near.concat([{ r: me, st: mst }]).sort(function (a, b) { return b.st.tot - a.st.tot; });
      var dash = (my * scale) % 24;
      list.forEach(function (it, i) {
        var y = 6 + i * 23.5; lc.fillStyle = '#0a0d18'; lc.fillRect(62, y, LW - 64, 20);
        lc.fillStyle = 'rgba(255,255,255,.12)'; for (var x = 62 - dash + 24; x < LW; x += 24) lc.fillRect(x, y + 9.5, 10, 1.2);
        lc.font = 'italic 700 12px "Barlow Condensed", sans-serif'; lc.textAlign = 'left'; lc.fillStyle = it.r.car.player ? '#3ddc6f' : '#eef0f6';
        lc.fillText((it.r.car.player ? 'YOU' : it.r.car.name).toUpperCase().slice(0, 11), 4, y + 14);
        var gx = cx + (it.st.tot - my) * scale; gx = Math.max(86, Math.min(LW - 14, gx));
        var crashed = it.r.res.status === 'crash' && it.st.done, ang = it.st.code === 4 ? w.fr * Math.PI * 2 : 0;
        drawCar(lc, gx, y + 10, ang, teamColor(it.r.car), it.r.car.player, crashed);
        if (crashed) flame(lc, gx, y + 8, ms / 1000);
        if (!it.r.car.player) {
          var gap = (it.st.tot - my) / Math.max(1, lapLen / 10);
          lc.font = 'italic 600 10px "Barlow Condensed", sans-serif'; lc.fillStyle = '#9aa3b8'; lc.textAlign = gx > cx ? 'right' : 'left';
          lc.fillText((gap >= 0 ? '+' : '') + gap.toFixed(1), gx > cx ? gx - 16 : gx + 16, y + 14);
        }
      });
    }
    // Announcer queue: each line stays up at least HOLD ms; must-hear calls (you, crashes, lead, last lap, win) wait their turn, the rest are skipped when they go stale.
    var HOLD = 2200, STALE = [1.5, 2.5, 5]; // race steps a call may wait, by priority (small talk, about you, must-hear)
    function pickCall(now) {
      var pend = calls.slice(queuePos).filter(function (c) { return c.t <= now && now - c.t <= STALE[c.pri] * speed; });
      if (!pend.length) { while (queuePos < calls.length && calls[queuePos].t <= now) queuePos++; return null; }
      var best = pend[0]; pend.forEach(function (c) { if (c.pri > best.pri) best = c; });
      queuePos = calls.indexOf(best) + 1;
      return best;
    }
    function drawHTML(w, nowMs) {
      var now = done ? 1e9 : w.s + w.fr;
      if (nowMs >= holdUntil || done) {
        var c = done ? null : pickCall(now);
        if (c) { c.said = true; shownCall = c; aWho.innerHTML = c.who ? faceHTML(c.who, 40) : ''; aLine.textContent = c.txt; aLine.className = 'aline' + (c.me ? ' me' : ''); aTs.textContent = '· ' + c.ts; holdUntil = nowMs + HOLD; talkUntil = nowMs + 1500; }
      }
      aHead.className = 'ahead sm' + (nowMs < talkUntil ? ' on' : '');
      var lead = 0; rows.forEach(function (r) { lead = Math.max(lead, carState(r, w).tot); });
      document.getElementById('lapc').textContent = lead >= rep.T ? 'Finished' : 'Lap ' + Math.min(CFG.laps, 1 + Math.floor(lead / lapLen)) + '/' + CFG.laps;
      var list = rows.map(function (r) { var st = carState(r, w); return { r: r, st: st, fin: r.res.status === 'fin' && st.done, dead: r.res.status === 'crash' && st.done }; });
      list.sort(function (a, b) { return (b.fin ? 1 : 0) - (a.fin ? 1 : 0) || (a.fin && b.fin ? a.r.pos - b.r.pos : (a.dead ? 1 : 0) - (b.dead ? 1 : 0) || b.st.tot - a.st.tot); });
      var leadTot = list[0].st.tot, bestX = null; list.forEach(function (x) { if (x.fin && (bestX === null || x.r.res.x < bestX)) bestX = x.r.res.x; });
      document.getElementById('tower').innerHTML = list.map(function (x, i) {
        if (!showAll && i >= 5 && !x.r.car.player) return '';
        var gap = i === 0 ? (x.fin ? AB.fmtTime(x.r.res.x) : 'LEADER') : x.dead ? 'OUT' : x.fin ? '+' + ((x.r.res.x - bestX) * CFG.secPerStep).toFixed(1) + 's' : '+' + ((leadTot - x.st.tot) / Math.max(1, lapLen / 10)).toFixed(1);
        var ev = x.dead ? '✕' : x.fin ? '✓' : EV_ICON[x.st.code] || (x.st.hs === 2 ? '!' : x.st.hs === 1 ? '≈' : '');
        var wear = x.dead ? '' : '<span style="color:' + ZONE[zoneOf(Math.max(0, x.st.wear))] + '">●</span>';
        return '<div class="tr' + (x.r.car.player ? ' me' : '') + (x.dead ? ' out' : '') + '"><span class="ps">' + (i + 1) + '</span><span class="cb" style="background:' + teamColor(x.r.car) + '"></span>' + faceHTML(x.r.car, 22) + '<span>' + flagOf(x.r.car) + '</span><span class="nm">' + esc(x.r.car.player ? 'You' : x.r.car.name) + '</span><span class="ev">' + ev + '</span>' + wear + '<span class="gp">' + gap + '</span></div>';
      }).join('');
      var st = carState(me, w), wear = Math.max(0, st.wear), z = zoneOf(wear);
      var shown = me.res.events.filter(function (q) { return q.x - 1 < w.s || (q.x - 1 === w.s && w.fr >= 0.5); });
      var hw = st.done ? '' : ['<span style="color:var(--good)">steady</span>', '<span style="color:var(--acc)">shaky</span>', '<span style="color:var(--bad)">OUT OF CONTROL</span>'][st.hs || 0];
      document.getElementById('wear').innerHTML = '<div class="wrow"><span>Handling</span>' + (hw || '<span class="dim">-</span>') + '</div><div class="wrow"><span>Tires</span><span style="color:' + ZONE[z] + '">' + tireWord(wear) + '</span></div>' +
        '<div class="wbar"><div class="wfill" style="width:' + Math.min(100, wear) + '%;background:' + ZONE[z] + '"></div></div><div class="wlog">' +
        (shown.length ? shown.slice().reverse().map(function (q) { return '<div class="r-' + q.type + '"><span class="dim">' + stamp(me, q.x - 0.5) + '</span> ' + EV_TXT[q.type] + '</div>'; }).join('') : '<div class="dim">No trouble yet.</div>') + '</div>';
    }
    function frame(ts) {
      if (lastTs === null) lastTs = ts;
      var dt = Math.min(100, ts - lastTs); lastTs = ts;
      lightMs += dt;
      var lights = lightsState(lightMs);
      if (!done && lightMs > lightsEnd) f += dt * speed / FRAME_MS;
      if (!done && f >= sch.total) { finish(); return; }
      var w = where(sch, done ? sch.total : f);
      drawTrack(w, lightMs, done ? -1 : lights); drawLanes(w, lightMs);
      var fi = Math.floor(f * 2); if (fi !== lastHTML || ts < talkUntil + 100 || ts >= holdUntil) { lastHTML = fi; drawHTML(w, ts); }
      raf = requestAnimationFrame(frame);
    }
    function finish() {
      done = true; f = sch.total; var w = where(sch, sch.total); drawHTML(w, performance.now());
      var fin = calls.filter(function (c) { return c.hi && c.t > 0; }).pop();
      if (fin) { aLine.textContent = fin.txt; aTs.textContent = '· ' + fin.ts; aWho.innerHTML = fin.who ? faceHTML(fin.who, 40) : ''; aLine.className = 'aline' + (fin.me ? ' me' : ''); }
      document.getElementById('ctl').style.display = 'none';
      document.getElementById('after').innerHTML = '<div class="blk"><div class="bt">All calls</div><div id="alog">' + calls.map(function (c) { return '<div class="' + (c.me ? 'me' : '') + '"><span class="t">' + c.ts + '</span>' + esc(c.txt) + '</div>'; }).join('') + '</div></div>' + resultsHTML(rep);
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(frame);
    }
    showRace.skip = function () { if (!done) { lightMs = lightsEnd + 1000; finish(); } };
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }

  // ---------- end of run ----------
  function finishRun() {
    if (run.statsDone) return; run.statsDone = true;
    var s = loadStats(), me = run.field[0];
    s.runs++; s.champN++; s.champSum += run.finalRank;
    if (run.phase === 'finished' && run.finalRank === 1) s.wins++;
    s.bestScore = Math.max(s.bestScore, me.points); s.bestRound = Math.max(s.bestRound, run.history.length);
    saveStats(s);
  }
  function showEnd() {
    stopRace(); finishRun();
    var me = run.field[0], won = run.phase === 'finished' && run.finalRank === 1;
    var h = '<div class="hdr sk"><span>' + (run.phase === 'dead' ? 'Eliminated' : won ? 'Champions!' : 'Championship complete') + '</span></div>';
    h += '<p class="big-result">' + (run.phase === 'dead' ? 'Cut after round ' + run.history.length + ' with ' + me.points + ' points.' : 'Final place: ' + run.finalRank + ' of ' + CFG.fieldSize + ' with ' + me.points + ' points.') + '</p>';
    h += '<h2>Your races</h2><table><tr><th>Round</th><th>Place</th><th class="n">Pts</th></tr>';
    run.history.forEach(function (r) { h += '<tr><td>' + r.round + '</td><td>' + r.pos + (r.status === 'crash' ? ' (crash)' : '') + '</td><td class="n">' + r.pts + '</td></tr>'; });
    h += '</table><h2>Final standings</h2>' + standingsTable() + '<h2>Your final car</h2>';
    AB.SLOTS.forEach(function (s) { h += slotCard(run.build[s], false); });
    h += '<button class="big" data-act="new">New championship</button><button data-act="home" style="width:100%">Stats</button>';
    $.innerHTML = h;
  }
  function stopRace() { if (raf) cancelAnimationFrame(raf); raf = null; showRace.skip = null; }

  // ---------- actions ----------
  function startNew() { run = AB.newChampionship((Date.now() % 1000000007) | 0, lib); persist(); showShop(); window.scrollTo(0, 0); }
  var actions = {
    new: function () { if (readSave() && !window.confirm('Abandon your current championship and start a new one?')) return; stopRace(); startNew(); },
    resume: function () {
      if (!(run && run.phase === 'shop')) run = AB.restore(readSave() || '', lib);
      if (run) showShop('Championship resumed.'); else { clearSave(); showStart(); }
      window.scrollTo(0, 0);
    },
    home: function () { stopRace(); persist(); showStart(); },
    buy: function (d) {
      var i = +d.i, off = run.offers[i], name = off ? AB.partName(off) : '', r = AB.buy(run, i);
      if (r.ok) { persist(); showShop((r.kind === 'upgrade' ? 'Upgraded ' : 'Bought ') + name + (r.trade ? ' (trade-in +' + r.trade + ' cr), net ' + r.cost + ' cr.' : ' for ' + r.cost + ' cr.')); }
      else showShop(r.why, true);
    },
    sell: function (d) {
      var p = run.build[d.s]; if (!p || p.t === 0) return;
      if (!window.confirm('Sell ' + AB.partName(p) + AB.stars(p) + ' for ' + AB.sellValue(p) + ' cr? The slot goes back to the stock part.')) return;
      var r = AB.sell(run, d.s); if (r.ok) { persist(); showShop('Sold ' + r.name + ' for ' + r.value + ' cr.'); }
    },
    reroll: function () { if (AB.reroll(run)) { persist(); showShop('Offers rerolled.'); } },
    lock: function () { AB.setLock(run, !run.locked); persist(); showShop(run.locked ? 'Shop locked: these offers will be waiting next round.' : 'Shop unlocked.'); },
    race: function () { report = AB.race(run); showRace(report); window.scrollTo(0, 0); },
    skip: function () { if (showRace.skip) showRace.skip(); },
    after: function () {
      var s = loadStats(); s.raceN++; s.placeSum += report.playerPos; saveStats(s);
      stopRace();
      if (run.phase === 'dead' || run.phase === 'finished') { clearSave(); showEnd(); }
      else {
        AB.next(run); persist();
        var notes = [];
        if (run.prizeLast > 0) notes.push('Brand prize money: +' + run.prizeLast + ' cr.');
        if (run.lockedIn) notes.push('Your locked offers are back.');
        if (run.bookieLast > 0) notes.push('Bookie pays out: +' + run.bookieLast + ' cr!'); else if (run.bookieLast < 0) notes.push('Bookie collects: ' + run.bookieLast + ' cr.');
        showShop(notes.join(' '));
      }
      window.scrollTo(0, 0);
    }
  };
  $.addEventListener('change', function (e) { if (e.target.id === 'flagSel') { try { localStorage.setItem(FLAG_KEY, e.target.value); } catch (er) {} } });
  $.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    actions[b.getAttribute('data-act')]({ i: b.getAttribute('data-i'), s: b.getAttribute('data-s') });
  });

  setTimeout(function () {
    buildRefs();
    lib = Bots.buildLibrary(LIB_SIZE, LIB_SEED);
    var saved = readSave();
    run = saved ? AB.restore(saved, lib) : null;
    if (run) showShop('Championship resumed.'); else { if (saved) clearSave(); showStart(); }
  }, 30);
})();
</script>
