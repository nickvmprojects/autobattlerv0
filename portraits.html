<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait lab</title>
<style>
  body { margin:0; background:#0b0f1a; color:#e8ecf4; font-family: system-ui, sans-serif; }
  h1 { font-size:20px; margin:14px 14px 4px; letter-spacing:1px; text-transform:uppercase; }
  p.sub { margin:0 14px 12px; color:#9aa6c0; font-size:14px; }
  .grid { display:grid; grid-template-columns: 1fr; gap:14px; padding:0 14px 30px; max-width:900px; margin:0 auto; }
  @media (min-width:640px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width:900px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  .card { background:#151b2b; border-radius:12px; overflow:hidden; border:1px solid #253050; }
  .art { aspect-ratio: 240 / 300; width:100%; background:#000; }
  .art img { width:100%; height:100%; image-rendering: pixelated; display:block; }
  .cap { padding:8px 12px 10px; }
  .id { display:inline-block; background:#ffcf3f; color:#151b2b; font-weight:800; border-radius:6px; padding:1px 7px; margin-right:6px; }
  .name { font-weight:700; }
  .note { color:#9aa6c0; font-size:13px; margin-top:3px; }
  a { color:#7fd3ff; }
</style>
</head>
<body>
<h1>Portrait lab</h1>
<p class="sub">Same original racer in each style (S9 is a coyote pilot). Below: the in-game roster. Rate them by ID. <a href="index.html">Back to the game</a></p>
<div class="grid" id="grid"></div>
<h1>In-game roster</h1>
<p class="sub">Each racer: signature, win and crash moods, plus the small face crop used in the timing tower.</p>
<div id="roster" style="padding:0 14px 30px;max-width:900px;margin:0 auto"></div>
<script src="portraits.js?v=0.15b"></script>
<script>
  var grid = document.getElementById('grid');
  Portraits.STYLES.forEach(function (s) {
    var card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<div class="art"></div><div class="cap"><span class="id">' + s.id.toUpperCase() + '</span><span class="name">' + s.name + '</span><div class="note">' + s.note + '</div></div>';
    var art = card.querySelector('.art'), svg = Portraits.draw(s.id);
    if (s.pixel) Portraits.pixelate(svg, s.pixel, function (url) { art.innerHTML = '<img alt="" src="' + url + '">'; });
    else art.innerHTML = svg;
    grid.appendChild(card);
  });
  var ro = document.getElementById('roster'), teams = ['#e8203a', '#2160c8', '#3ddc6f', '#ff9e1b', '#b06bff', '#18b5b0'];
  Portraits.RACERS.forEach(function (r, i) {
    var t = teams[i % teams.length], im = function (m, crop, w) { return '<img alt="" style="width:' + w + 'px;' + (crop ? 'border-radius:50%;' : 'border-radius:8px;') + '" src="' + Portraits.racerURL(r, { mood: m, team: t, crop: crop }) + '">'; };
    ro.insertAdjacentHTML('beforeend', '<div class="card" style="margin-bottom:10px;padding:8px"><div style="font-weight:700;margin-bottom:6px">' + r.name + ' <span class="id">' + r.style.toUpperCase() + '</span></div><div style="display:flex;gap:6px;align-items:center">' + im('sig', false, 90) + im('win', false, 90) + im('crash', false, 90) + im('sig', true, 44) + '</div></div>');
  });
</script>
</body>
</html>
